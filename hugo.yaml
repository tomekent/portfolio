  about:
    enable: true
    title: "About Me"
    image: "/images/profile.png"
    content: |-
      I'm a Lead Machine Learning Scientist at Mind Foundry, with 10+ years' experience spanning applied research and delivery leadership in machine learning, autonomous systems, robotics in defence and national security. I lead cross-functional teams of ML scientists and engineers, line manage senior technical staff, and work closely with customers and commercial stakeholders to turn ambiguous operational problems into deployed ML solutions — spanning computer vision, anomaly detection, predictive maintenance, electronic surveillance, and localisation and tracking.

      Before moving into industry, I spent seven years as a researcher at the University of Bristol working on multi-agent systems, decision-making, and autonomous vehicles, including the UK's flagship driverless car project (Venturer) and a PhD in Aerospace Engineering focused on optimal routing for commercial formation flight.

      You can find my academic publications below, or see my [Google Scholar](https://scholar.google.co.uk/citations?user=gdGPmPIAAAAJ) and [ResearchGate](https://www.researchgate.net/profile/Thomas_Kent4) profiles for the full record.
    skills:
      enable: true
      title: "Technical areas I work across:"
      items:
        - "Machine Learning"
        - "Computer vision"
        - "Anomaly detection"
        - "predictive maintenance"
        - "Signal Processing"
        - "Electronic surveillance"
        - "State estimation and Tracking"
        - "Multi-Agent Systems"
        - "Robotics and Control"
        - "Optimisation"

  experience:
    enable: true
    items:
      - company: "Mind Foundry"
        companyUrl: "http://mindfoundry.ai"
        jobs:
          - name: "Lead Machine Learning Scientist"
            date: "2023 - Present"
            content: |-
              Set technical direction and scientific standards across Mind Foundry's Defence and National Security portfolio. Lead cross-functional teams of Machine Learning Scientists and Engineers, line managing senior technical staff and driving hiring, mentorship and team growth. Partner with customers and commercial stakeholders to translate ambiguous operational challenges into deployed ML solutions, leading technical bids that have helped win over £2.5m in new and follow-on work. Hands-on technical lead across projects spanning computer vision, anomaly detection, predictive maintenance, electronic surveillance, and localisation and tracking.
          - name: "Machine Learning Scientist"
            date: "2022 - 2023"
            content: |-
              Developed machine learning, signal processing, simulation and modelling techniques for novel solutions across domains including radar and RF sensing. Acted as technical lead on projects spanning radar, tracking, multi-agent systems, explainability and interpretability, and contributed significantly to writing successful bids for new and follow-on work.
      - company: "University of Bristol"
        companyUrl: "https://www.bristol.ac.uk"
        jobs:
          - name: "Senior Research Associate"
            date: "2018 - 2022"
            content: |-
              As part of the [TB-Phase project](https://www.tbphase.org), a 5 year EPSRC Prosperity Partnership researching new engineering design for hybrid autonomous systems, researched the use of multi-agent systems for tasking, routing and surveillance problems. Used evolutionary algorithms and reinforcement learning to develop local single-agent policies capable of scaling to multi-agent scenarios, and built multi-agent simulation software for testing and deployment across a range of vehicles.
          - name: "Research Associate"
            date: "2015 - 2018"
            content: |-
              Developed path-planning and decision-making capabilities for the [Venturer project](https://www.venturer-cars.com/venturer-project/), the UK's flagship driverless car trials. Designed and implemented motion planning and decision-making algorithms capable of driving a car autonomously through real-world trials involving members of the public, and led the physical and software integration work across a number of project partners.

  education:
    enable: true
    items:
      - title: "PhD, Aerospace Engineering"
        school:
          name: "University of Bristol"
          url: "https://www.bristol.ac.uk"
        date: "2011 - 2015"
        content: |-
          Thesis: *"Optimal Routing and Assignment for Commercial Formation Flight"*.

          Developed a scalable analytic-geometric approach to commercial formation flight routing, enabling fast cost estimation and large-scale fleet assignment via Mixed Integer Linear Programming. Demonstrated fuel savings of 8-13% in a Transatlantic case study, with consistent gains shown across flights of varied distance, geography, and formation size.
      - title: "MA (Hons), Pure Mathematics"
        school:
          name: "University of Edinburgh"
          url: "https://www.ed.ac.uk"
        date: "2007 - 2011"

